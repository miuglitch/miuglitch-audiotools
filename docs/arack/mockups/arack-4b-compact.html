<!doctype html><html><head><meta charset="utf-8"><title>ARAck mockup 4b · Compact (revised)</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="base.css">
<style>
body{font-size:13px}
.hd{padding:8px 14px;border-bottom-width:4px}
.ro{font-size:22px}
.logo-svg svg{height:16px!important}
.logo-sub{font-size:11px}
.iblk{padding:0 12px}
.main{flex:1;display:flex;min-height:0}
.slots{width:270px;display:flex;flex-direction:column;border-right:4px solid var(--frame)}
.ph{height:36px}
.ph .tg{font:600 10px var(--font);letter-spacing:.08em;padding:4px 7px;border-radius:5px;border:1px solid #8c8c88;color:#fff}
.slot{display:flex;align-items:center;gap:8px;padding:0 0 0 6px;height:34px;border-bottom:1px solid var(--row-line)}
.grip{width:12px;display:flex;flex-direction:column;gap:2.5px;opacity:.55}
.grip i{display:block;height:1.5px;background:#8c8c88}
.slot .pw{width:22px;height:22px}.slot .pw svg{width:12px;height:12px}
.slot .nm{flex:1;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .lt{width:58px;align-self:stretch;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:11.5px;color:var(--th-sub);border-left:1px solid #3b3b3b}
.slot.off .nm{color:var(--muted)}
.slot.cur{background:var(--warm)}
.slot.empty .nm{color:var(--muted);font-weight:400}
.slot.drag{opacity:.5}
.view{flex:1;display:flex;flex-direction:column;min-width:0}
.plug{flex:1;position:relative;background:#0a0a0a}
.plug .canvas{position:absolute;inset:10px;border:1px solid #262626}
.auto{height:220px;border-top:4px solid var(--frame);display:flex;flex-direction:column;flex-shrink:0}
.tabs{display:flex;border-bottom:1px solid var(--row-line);background:var(--th-bg);align-items:stretch}
.tab{display:flex;align-items:center;gap:7px;padding:8px 12px 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--th-sub);border-bottom:3px solid transparent}
.tab .cb{width:12px;height:12px;border-radius:3px;border:1px solid #5c5b58}
.tab.on{color:#fff}
.tab.on .cb{border-color:currentColor}
.tab .vv{font-weight:400;letter-spacing:0;text-transform:none;font-size:12px}
.tabs .grow{flex:1}
.tabs .btn{align-self:center;margin-right:8px;padding:4px 8px;font-size:10px}
.area{flex:1;position:relative;overflow:hidden}
.area .wv{position:absolute;inset:8px 0 8px 0;opacity:.9}
.area .ln{position:absolute;inset:0}
.hover{position:absolute;top:0;bottom:0;width:1px;background:#f4f4f2;z-index:6}
.hbox{position:absolute;top:8px;z-index:7;background:#f4f4f2;color:#0d0d0d;font-size:11.5px;font-weight:600;padding:4px 7px;border-radius:4px;white-space:nowrap}
.hbox small{display:block;font-weight:400;font-size:10.5px;color:#5c5b58}
.msr{height:24px;position:relative;background:var(--th-bg);border-top:1px solid var(--row-line);font-size:10px;font-weight:600;color:var(--th-sub)}
.msr span{position:absolute;bottom:0;padding-left:4px;border-left:1px solid #7c7c78;height:24px;padding-top:9px}
.msr em{position:absolute;bottom:0;height:5px;border-left:1px solid #3b3b3b}
.cap{position:absolute;right:8px;bottom:5px;font-size:10px;letter-spacing:.08em;color:#5c5b58}
</style></head><body class="dark">
<div class="app">
 <div class="hd">
  <div class="logo"><div class="logo-svg"></div><div class="logo-sub">ARACK</div></div>
  <div class="iblk"><div class="lbl">Clip length</div><div class="ro or">30 000.00<small>MS</small></div></div>
  <div class="iblk"><div class="lbl">ARA file</div><div class="ro" style="font-size:18px">Lead Vox_Take 3.wav</div></div>
  <div class="iblk"><div class="lbl">Active</div><div class="ro">6/12</div></div>
  <div class="grow"></div>
  <div class="iblk" style="flex-direction:row;align-items:center;gap:6px"><span class="btn hd-btn">Undo</span><span class="btn hd-btn">Redo</span><span class="btn hd-btn">Chain A</span><span class="btn hd-btn">⋯</span></div>
 </div>
 <div class="main">
  <div class="slots">
   <div class="ph"><span class="t">CHAIN</span><span class="grow"></span><span class="tg">LATENCY</span></div>
   <div id="slots"></div>
  </div>
  <div class="view">
   <div class="ph k-or"><span class="t">02 · Pitch Editor</span><span class="badge b-or">ARA2</span><span class="grow"></span><span class="btn">Float</span><span class="btn on">On</span></div>
   <div class="plug"><div class="canvas" id="pv"></div></div>
  </div>
 </div>
 <div class="auto">
  <div class="tabs" id="tabs"></div>
  <div class="area" id="area"></div>
  <div class="msr" id="msr"></div>
 </div>
</div>
<script src="common.js"></script>
<script>
header(document);
const g='<div class="grip"><i></i><i></i><i></i></div>';
document.getElementById('slots').innerHTML=SLOTS.map((s,i)=>{
  if(!s) return `<div class="slot empty">${g.replace('grip','grip" style="visibility:hidden')}<div class="pw">${POWER}</div><div class="nm">Empty</div><span class="lt"></span></div>`;
  return `<div class="slot ${s.on?'':'off'} ${i==1?'cur':''}">${g}<div class="pw ${s.on?'on':''}">${POWER}</div><div class="nm">${s.n}</div><span class="lt num">${s.on?fmtLat(s.lat):'off'}</span></div>`;
}).join('');
document.getElementById('pv').innerHTML=pitchView(900,360,true);
// parameter tabs: checkbox = shown/overlaid
const shown=[0,1,3];
document.getElementById('tabs').innerHTML=LANES.map((l,i)=>{const on=shown.includes(i);const c=KCOL[l.k];
  return `<span class="tab ${on?'on':''}" style="${on?'border-bottom-color:'+c+';color:'+c:''}"><span class="cb" style="${on?'background:'+c:''}"></span>${l.p.split(' · ')[1]} <span class="vv">${l.v}</span></span>`;}).join('')+'<span class="tab">+ Add</span><span class="grow"></span><span class="btn on">Overlay</span><span class="btn">Stack</span>';
// waveform underneath + overlaid lanes
const W=1100,H=150;
let a=`<div class="wv">${waveSVG(W,H,'#2a2a2a')}</div>`;
shown.forEach(i=>a+=`<div class="ln">${laneSVG(LANES[i],W,H,{dark:true,noDots:i!==0})}</div>`);
const hx=41.5;
a+=`<div class="hover" style="left:${hx}%"></div><div class="hbox" style="left:calc(${hx}% + 8px)">12 450.00 ms<small>Formant +1.2 st</small></div>`;
a+='<span class="cap">WAVEFORM · LEAD VOX_TAKE 3.WAV</span>';
document.getElementById('area').innerHTML=a;
// ms ruler at the bottom: 0–30 000 ms, labels every 2 500 ms, ticks every 500 ms
let r='';for(let t=0;t<=30000;t+=500){const x=t/30000*100;r+= t%2500===0?`<span style="left:${x}%">${t.toLocaleString('en').replace(/,/g,' ')}</span>`:`<em style="left:${x}%"></em>`;}
document.getElementById('msr').innerHTML=r+'<span style="left:auto;right:6px;border:0">MS</span>';
</script></body></html>
