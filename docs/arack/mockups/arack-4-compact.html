<!doctype html><html><head><meta charset="utf-8"><title>ARAck mockup 4 · Compact</title>
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="base.css">
<style>
body{font-size:13px}
.hd{padding:8px 14px;border-bottom-width:4px}
.ro{font-size:22px}
.logo-svg svg{height:16px!important}
.logo-sub{font-size:11px}
.iblk{padding:0 12px}
.main{flex:1;display:flex;min-height:0}
.slots{width:250px;display:flex;flex-direction:column;border-right:4px solid var(--frame)}
.slot{display:flex;align-items:center;gap:8px;padding:0 10px;height:34px;border-bottom:1px solid var(--row-line)}
.slot .pw{width:22px;height:22px}.slot .pw svg{width:12px;height:12px}
.slot .nm{flex:1;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .lt{font-size:11.5px;color:var(--th-sub)}
.slot.off .nm{color:var(--muted)}
.slot.cur{background:var(--warm)}
.slot.empty .nm{color:var(--muted);font-weight:400}
.ph{height:36px}
.view{flex:1;display:flex;flex-direction:column;min-width:0}
.plug{flex:1;position:relative;background:#0a0a0a}
.plug .canvas{position:absolute;inset:10px;border:1px solid #262626}
.auto{height:190px;border-top:4px solid var(--frame);display:flex;flex-direction:column;flex-shrink:0}
.tabs{display:flex;border-bottom:3px solid var(--th-line);background:var(--th-bg)}
.tab{padding:9px 12px 7px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--th-sub);border-bottom:3px solid transparent;margin-bottom:-3px}
.tab.on{color:#fff}
.lane{flex:1;position:relative}
.val{position:absolute;right:12px;top:8px;font-size:22px;font-weight:300;z-index:2}
</style></head><body class="dark">
<div class="app">
 <div class="hd">
  <div class="logo"><div class="logo-svg"></div><div class="logo-sub">ARACK</div></div>
  <div class="iblk"><div class="lbl">Tempo</div><div class="ro or">128.00</div></div>
  <div class="iblk"><div class="lbl">Latency</div><div class="ro" id="tl"></div></div>
  <div class="iblk"><div class="lbl">Active</div><div class="ro">6/12</div></div>
  <div class="grow"></div>
  <div class="iblk" style="flex-direction:row;align-items:center;gap:6px"><span class="btn hd-btn">Chain A</span><span class="btn hd-btn">⋯</span></div>
 </div>
 <div class="main">
  <div class="slots">
   <div class="ph"><span class="t">Slots</span><span class="grow"></span><span class="s">ms</span></div>
   <div id="slots"></div>
  </div>
  <div class="view">
   <div class="ph k-or"><span class="t">02 · Pitch Editor</span><span class="badge b-or">ARA2</span><span class="grow"></span><span class="btn">Float</span><span class="btn on">On</span></div>
   <div class="plug"><div class="canvas" id="pv"></div></div>
  </div>
 </div>
 <div class="auto">
  <div class="tabs" id="tabs"></div>
  <div class="ruler" id="ruler" style="height:22px"></div>
  <div class="lane" id="lane"></div>
 </div>
</div>
<script src="common.js"></script>
<script>
header(document);
document.getElementById('tl').innerHTML=totalLatency()+'<small>MS</small>';
document.getElementById('slots').innerHTML=SLOTS.map((s,i)=>{
  if(!s) return `<div class="slot empty"><div class="pw">${POWER}</div><div class="nm">Empty</div></div>`;
  return `<div class="slot ${s.on?'':'off'} ${i==1?'cur':''}"><div class="pw ${s.on?'on':''}">${POWER}</div><div class="nm">${s.n}</div><span class="lt num">${s.on?fmtLat(s.lat):'off'}</span></div>`;
}).join('');
document.getElementById('pv').innerHTML=pitchView(900,380,true);
document.getElementById('tabs').innerHTML=LANES.map((l,i)=>`<span class="tab ${i==0?'on':''}" style="${i==0?'border-bottom-color:'+KCOL[l.k]:''}">${l.p.split(' · ')[1]}</span>`).join('')+'<span class="tab">+ Add</span>';
ruler(document.getElementById('ruler'));
document.getElementById('lane').innerHTML=`<span class="val" style="color:#ff7a45">${LANES[0].v}</span>`+laneSVG(LANES[0],1100,110,{dark:true});
</script></body></html>
